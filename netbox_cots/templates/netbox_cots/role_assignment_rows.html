<table class="table table-hover mb-0"><thead><tr><th>Rôle</th><th>COTS</th><th>Version</th></tr></thead><tbody>
{% for assignment in assignments %}<tr><td>{{ assignment.role }}</td><td>{{ assignment.application }}</td><td>{{ assignment.software_version.version }}</td></tr>
{% empty %}<tr><td colspan="3">Aucun COTS affecté au rôle de cette machine.</td></tr>{% endfor %}
</tbody></table>
